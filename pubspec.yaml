name: caixinha
description: Controle financeiro simples para MEIs e autônomos.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  go_router: ^16.0.0
  drift: ^2.28.0
  drift_flutter: ^0.2.4
  path_provider: ^2.1.5
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  intl: any
  fl_chart: ^1.0.0
  qr_flutter: ^4.1.0
  flutter_local_notifications: ^19.4.0
  timezone: ^0.10.1
  flutter_timezone: ^4.1.1
  pdf: ^3.11.3
  share_plus: ^11.0.0
  file_picker: ^10.0.0
  http: ^1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.5.4
  drift_dev: ^2.28.0
  freezed: ^3.2.0
  json_serializable: ^6.9.5
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#00796B"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  remove_alpha_ios: true
  min_sdk_android: 21

flutter_native_splash:
  color: "#E0F2F1"
  image: assets/icon/splash.png
  color_dark: "#00332C"
  android_12:
    color: "#E0F2F1"
    image: assets/icon/splash.png
    color_dark: "#00332C"
